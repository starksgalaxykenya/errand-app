<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errand - Uber for Errands</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-20 font-sans">

    <nav class="bg-green-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic">ERRAND</h1>
            <div class="text-xs bg-green-700 px-3 py-1 rounded-full border border-green-400">M-PESA ESCROW ACTIVE</div>
        </div>
    </nav>

    <div id="app" class="container mx-auto p-4 max-w-lg">
        
        <div id="poster-view">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Request an Errand</h2>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                <input type="text" id="taskTitle" placeholder="What do you need? (e.g. Buy groceries)" class="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
                <input type="text" id="taskLocation" placeholder="Pickup/Dropoff Location" class="w-full p-4 border rounded-xl outline-none bg-gray-50">
                <textarea id="taskDetails" placeholder="Detailed instructions..." class="w-full p-4 border rounded-xl outline-none bg-gray-50 h-24"></textarea>
                
                <button onclick="postErrand()" id="postBtn" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">
                    Post Errand
                </button>
            </div>
        </div>

        <div id="runner-view" class="hidden">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Available Near You</h2>
            <div id="errandList" class="space-y-4 text-center py-10 text-gray-500">
                Loading errands...
            </div>
        </div>

    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 shadow-2xl">
        <button onclick="switchTab('poster-view')" class="flex flex-col items-center group">
            <div class="p-2 rounded-lg group-active:bg-green-100">🛒</div>
            <span class="text-[10px] font-bold text-gray-600 uppercase">Post Errand</span>
        </button>
        <button onclick="switchTab('runner-view')" class="flex flex-col items-center group">
            <div class="p-2 rounded-lg group-active:bg-green-100">🏃</div>
            <span class="text-[10px] font-bold text-gray-600 uppercase">Find Work</span>
        </button>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDn3dGe2dhgfrqwYENgWA1biEW8ngXv068",
            authDomain: "office-manager-pro-1b6ae.firebaseapp.com",
            projectId: "office-manager-pro-1b6ae",
            storageBucket: "office-manager-pro-1b6ae.firebasestorage.app",
            messagingSenderId: "202156442292",
            appId: "1:202156442292:web:664d17e9c8e75535168de1",
            measurementId: "G-BTY9GY3HBX"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. NAVIGATION LOGIC ---
        function switchTab(viewId) {
            document.getElementById('poster-view').classList.add('hidden');
            document.getElementById('runner-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
            
            if(viewId === 'runner-view') {
                loadErrands();
            }
        }

        // --- 3. POSTER LOGIC (Writing to Database) ---
        async function postErrand() {
            const btn = document.getElementById('postBtn');
            const title = document.getElementById('taskTitle').value;
            const location = document.getElementById('taskLocation').value;
            const details = document.getElementById('taskDetails').value;

            if(!title || !location) return alert("Please fill in the title and location.");

            btn.disabled = true;
            btn.innerText = "Posting...";

            try {
                await db.collection("errands").add({
                    title: title,
                    location: location,
                    details: details,
                    status: "OPEN",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("✅ Success! Your errand is now live.");
                document.getElementById('taskTitle').value = "";
                document.getElementById('taskLocation').value = "";
                document.getElementById('taskDetails').value = "";
                switchTab('runner-view'); // Take them to see their post
            } catch (e) {
                console.error("Error:", e);
                alert("Error connecting to database. Make sure you enabled Firestore in Test Mode!");
            } finally {
                btn.disabled = false;
                btn.innerText = "Post Errand";
            }
        }

        // --- 4. RUNNER LOGIC (Reading from Database) ---
        function loadErrands() {
            const list = document.getElementById('errandList');
            
            // This listens for changes in REAL-TIME
            db.collection("errands")
              .where("status", "==", "OPEN")
              .orderBy("timestamp", "desc")
              .onSnapshot((snapshot) => {
                if (snapshot.empty) {
                    list.innerHTML = "<p class='mt-10'>No errands available right now.</p>";
                    return;
                }

                list.innerHTML = ""; // Clear current list
                snapshot.forEach((doc) => {
                    const errand = doc.data();
                    const card = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 text-left">
                            <h3 class="font-bold text-lg text-gray-800">${errand.title}</h3>
                            <p class="text-green-600 font-bold text-xs uppercase mb-2">📍 ${errand.location}</p>
                            <p class="text-gray-600 text-sm mb-4">${errand.details}</p>
                            
                            <div class="flex items-center gap-2 border-t pt-4">
                                <input type="number" id="bid-${doc.id}" placeholder="Your Price (KES)" 
                                    class="w-full p-2 bg-gray-50 border rounded-lg text-sm">
                                <button onclick="sendBid('${doc.id}', '${errand.title}')" 
                                    class="bg-black text-white px-4 py-2 rounded-lg text-sm font-bold active:bg-gray-800">
                                    Bid
                                </button>
                            </div>
                        </div>
                    `;
                    list.innerHTML += card;
                });
            });
        }

        function sendBid(errandId, title) {
            const amount = document.getElementById(`bid-${errandId}`).value;
            if(!amount) return alert("Enter a price first!");
            
            // Calculating the split for the Runner's knowledge
            const companyCut = amount * 0.15;
            const runnerTake = amount * 0.85;

            alert(`Bid for "${title}":\nTotal: KES ${amount}\nYou will receive: KES ${runnerTake}\n(Errand Fee: KES ${companyCut})`);
        }
    </script>
</body>
</html>
