<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errand - Sign Up & KYC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div id="auth-container" class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full">
        <!-- Step 1: Google Login -->
        <div id="login-section">
            <div class="mb-6 text-center">
                <div class="w-20 h-20 bg-gradient-to-r from-lime-500 to-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="package" class="text-white w-10 h-10"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">ErrandPro</h1>
                <p class="text-gray-600">Get things done, or earn by running errands</p>
            </div>
            
            <button id="google-login-btn" class="flex items-center justify-center w-full border-2 border-gray-200 py-3 rounded-xl hover:bg-gray-50 transition-all font-semibold gap-3 mb-6">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/0/google.svg" width="20">
                Continue with Google
            </button>
            
            <div class="text-center text-gray-500 text-sm">
                <p>Secure • Verified • Fast Payments</p>
            </div>
        </div>

        <!-- Step 2: Role Selection -->
        <div id="role-section" class="hidden">
            <h2 class="text-xl font-semibold mb-6 text-gray-800">Choose Your Role</h2>
            <div class="grid gap-4 mb-6">
                <button onclick="selectRole('client')" class="p-6 border-2 border-gray-100 rounded-xl hover:border-lime-500 hover:bg-lime-50 transition-all group text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center group-hover:bg-blue-200">
                            <i data-lucide="user" class="text-blue-600 w-6 h-6"></i>
                        </div>
                        <div>
                            <span class="block font-bold text-lg text-gray-800">Client</span>
                            <span class="text-gray-500 text-sm">I need help with errands and tasks</span>
                        </div>
                    </div>
                    <ul class="mt-4 text-xs text-gray-600 space-y-1">
                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-green-500"></i> Post errands with budgets</li>
                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-green-500"></i> Secure escrow payments</li>
                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-green-500"></i> Rate and review runners</li>
                    </ul>
                </button>
                
                <button onclick="selectRole('runner')" class="p-6 border-2 border-gray-100 rounded-xl hover:border-lime-500 hover:bg-lime-50 transition-all group text-left">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-lime-100 rounded-lg flex items-center justify-center group-hover:bg-lime-200">
                            <i data-lucide="bike" class="text-lime-600 w-6 h-6"></i>
                        </div>
                        <div>
                            <span class="block font-bold text-lg text-gray-800">Runner</span>
                            <span class="text-gray-500 text-sm">I want to earn by running errands</span>
                        </div>
                    </div>
                    <ul class="mt-4 text-xs text-gray-600 space-y-1">
                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-green-500"></i> Earn money on your schedule</li>
                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-green-500"></i> Secure payment protection</li>
                        <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-green-500"></i> Build your rating profile</li>
                    </ul>
                </button>
            </div>
            <button onclick="goBackToLogin()" class="text-gray-500 text-sm hover:text-gray-700">
                ← Back to login
            </button>
        </div>

        <!-- Step 3: KYC Form -->
        <div id="kyc-section" class="hidden">
            <div class="mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-2">Complete Your Profile</h2>
                <p class="text-gray-500 text-sm">We need some information to verify your account</p>
            </div>
            
            <form id="kyc-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700">Full Name *</label>
                    <input type="text" id="full-name" required 
                           class="w-full border-2 border-gray-100 rounded-xl p-3 focus:border-lime-500 outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700">Phone Number *</label>
                    <div class="flex gap-2">
                        <select class="border-2 border-gray-100 rounded-xl p-3 w-24">
                            <option>+254</option>
                            <option>+255</option>
                            <option>+256</option>
                        </select>
                        <input type="tel" id="phone" required placeholder="712 345 678"
                               class="flex-1 border-2 border-gray-100 rounded-xl p-3 focus:border-lime-500 outline-none">
                    </div>
                </div>

                <!-- Runner-Specific Fields -->
                <div id="runner-fields" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700">ID Number *</label>
                        <input type="text" id="id-number" 
                               class="w-full border-2 border-gray-100 rounded-xl p-3 focus:border-lime-500 outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700">Primary Location *</label>
                        <input type="text" id="location-input" placeholder="Enter your city or area"
                               class="w-full border-2 border-gray-100 rounded-xl p-3 focus:border-lime-500 outline-none">
                        <div id="location-map" class="h-48 mt-2 rounded-xl bg-gray-100 hidden"></div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700">Transport Mode</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer">
                                <input type="radio" name="transport" value="bike" class="text-lime-500">
                                <i data-lucide="bike" class="w-4 h-4"></i>
                                <span class="text-sm">Bike</span>
                            </label>
                            <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer">
                                <input type="radio" name="transport" value="motorcycle" class="text-lime-500">
                                <i data-lucide="zap" class="w-4 h-4"></i>
                                <span class="text-sm">Motorcycle</span>
                            </label>
                            <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer">
                                <input type="radio" name="transport" value="car" class="text-lime-500">
                                <i data-lucide="car" class="w-4 h-4"></i>
                                <span class="text-sm">Car</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Client-Specific Fields -->
                <div id="client-fields" class="hidden space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1 text-gray-700">Preferred Payment Method *</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center gap-3 p-4 border-2 border-gray-100 rounded-xl cursor-pointer hover:border-lime-300">
                                <input type="radio" name="payment-method" value="mpesa" class="text-lime-500" checked>
                                <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                                    <i data-lucide="smartphone" class="text-green-600"></i>
                                </div>
                                <div>
                                    <span class="font-bold block">M-Pesa</span>
                                    <span class="text-xs text-gray-500">Mobile Money</span>
                                </div>
                            </label>
                            <label class="flex items-center gap-3 p-4 border-2 border-gray-100 rounded-xl cursor-pointer hover:border-lime-300">
                                <input type="radio" name="payment-method" value="bank" class="text-lime-500">
                                <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                                    <i data-lucide="building" class="text-blue-600"></i>
                                </div>
                                <div>
                                    <span class="font-bold block">Bank Transfer</span>
                                    <span class="text-xs text-gray-500">Direct to bank</span>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="goBackToRole()" 
                            class="px-6 py-3 rounded-xl font-semibold bg-gray-100 hover:bg-gray-200">
                        Back
                    </button>
                    <button type="submit" 
                            class="flex-1 bg-gradient-to-r from-lime-500 to-green-500 text-white font-bold py-3 rounded-xl hover:opacity-90">
                        Complete Registration
                    </button>
                </div>
            </form>
        </div>

        <!-- Loading -->
        <div id="loading-section" class="hidden">
            <div class="text-center py-8">
                <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-lime-500 mx-auto mb-4"></div>
                <h3 class="font-semibold text-gray-800 mb-2">Setting up your account</h3>
                <p class="text-gray-500 text-sm">This will only take a moment...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDn3dGe2dhgfrqwYENgWA1biEW8ngXv068",
            authDomain: "office-manager-pro-1b6ae.firebaseapp.com",
            projectId: "office-manager-pro-1b6ae",
            storageBucket: "office-manager-pro-1b6ae.firebasestorage.app",
            messagingSenderId: "202156442292",
            appId: "1:202156442292:web:664d17e9c8e75535168de1",
            measurementId: "G-BTY9GY3HBX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const provider = new GoogleAuthProvider();

        let selectedRole = null;
        let userLocation = null;

        // Initialize Google Maps Autocomplete
        function initLocationAutocomplete() {
            const input = document.getElementById('location-input');
            const autocomplete = new google.maps.places.Autocomplete(input, {
                types: ['geocode'],
                componentRestrictions: { 'country': 'ke' }
            });
            
            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (place.geometry) {
                    userLocation = {
                        lat: place.geometry.location.lat(),
                        lng: place.geometry.location.lng(),
                        address: place.formatted_address
                    };
                }
            });
        }

        // Navigation Functions
        window.goBackToLogin = () => {
            document.getElementById('role-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        };

        window.goBackToRole = () => {
            document.getElementById('kyc-section').classList.add('hidden');
            document.getElementById('role-section').classList.remove('hidden');
        };

        // Google Login
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                checkUserRole(result.user);
            } catch (error) {
                console.error("Auth Error:", error);
                alert("Login failed. Please try again.");
            }
        });

        // Check if user exists
        async function checkUserRole(user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            const userDoc = await getDoc(doc(db, "users", user.uid));
            
            if (userDoc.exists()) {
                redirectToDashboard(userDoc.data().role);
            } else {
                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('role-section').classList.remove('hidden');
            }
        }

        // Role Selection
        window.selectRole = (role) => {
            selectedRole = role;
            document.getElementById('role-section').classList.add('hidden');
            document.getElementById('kyc-section').classList.remove('hidden');
            
            // Show role-specific fields
            if (role === 'runner') {
                document.getElementById('runner-fields').classList.remove('hidden');
                initLocationAutocomplete();
            } else {
                document.getElementById('client-fields').classList.remove('hidden');
            }
        };

        // KYC Form Submission
        document.getElementById('kyc-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = auth.currentUser;
            if (!user) return;

            document.getElementById('kyc-section').classList.add('hidden');
            document.getElementById('loading-section').classList.remove('hidden');

            const userData = {
                uid: user.uid,
                email: user.email,
                displayName: document.getElementById('full-name').value,
                phoneNumber: document.getElementById('phone').value,
                role: selectedRole,
                kycStatus: 'pending',
                createdAt: new Date(),
                lastActive: new Date()
            };

            // Add role-specific data
            if (selectedRole === 'runner') {
                userData.idNumber = document.getElementById('id-number').value;
                userData.location = userLocation || { address: document.getElementById('location-input').value };
                userData.transportMode = document.querySelector('input[name="transport"]:checked')?.value;
                userData.kycVerified = false;
            } else {
                userData.paymentMethod = document.querySelector('input[name="payment-method"]:checked')?.value;
            }

            try {
                await setDoc(doc(db, "users", user.uid), userData);
                redirectToDashboard(selectedRole);
            } catch (error) {
                console.error("Error saving user:", error);
                alert("Error saving profile. Please try again.");
            }
        });

        function redirectToDashboard(role) {
            if (role === 'client') {
                window.location.href = 'client.html';
            } else if (role === 'runner') {
                window.location.href = 'runner.html';
            }
        }

        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
