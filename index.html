<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errand - Real-time Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans pb-20">

    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
            <h1 class="text-4xl font-black text-green-600 mb-2 italic">ERRAND</h1>
            <p class="text-gray-500 mb-8 font-medium">Uber for Errands in Kenya</p>
            <div class="space-y-4">
                <button onclick="signInWithGoogle('poster')" class="w-full flex items-center justify-center gap-3 bg-white border-2 py-4 rounded-2xl font-bold shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                    Sign in as Poster
                </button>
                <button onclick="signInWithGoogle('runner')" class="w-full flex items-center justify-center gap-3 bg-black text-white py-4 rounded-2xl font-bold shadow-lg">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" class="brightness-200">
                    Sign in as Runner
                </button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
            <div class="flex items-center gap-2">
                <div id="user-photo" class="w-8 h-8 rounded-full bg-gray-200 overflow-hidden border"></div>
                <span id="display-role" class="font-black text-[10px] uppercase bg-green-100 text-green-700 px-2 py-1 rounded"></span>
            </div>
            <button onclick="logout()" class="text-red-500 text-xs font-bold border px-3 py-1 rounded-lg">Logout</button>
        </nav>

        <div id="view-poster" class="hidden p-4 max-w-lg mx-auto">
            <h2 class="text-xl font-bold mb-4">Post an Errand</h2>
            <div class="bg-white p-5 rounded-2xl shadow-sm border mb-8">
                <input type="text" id="tTitle" placeholder="Task Title" class="w-full p-4 mb-3 bg-gray-50 rounded-xl border">
                <input type="text" id="tLoc" placeholder="Location" class="w-full p-4 mb-3 bg-gray-50 rounded-xl border">
                <button onclick="createNewErrand()" class="w-full bg-green-600 text-white py-4 rounded-xl font-black">Post to Marketplace</button>
            </div>
            <div id="my-errands-list" class="space-y-4"></div>
        </div>

        <div id="view-runner" class="hidden p-4 max-w-lg mx-auto">
            <h2 class="text-xl font-bold mb-4">Live Errands Feed</h2>
            <div id="all-errands-list" class="space-y-4"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
