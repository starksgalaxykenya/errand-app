<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errand - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <div id="auth-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
            <h1 class="text-3xl font-black text-green-600 mb-2">ERRAND</h1>
            <p class="text-gray-500 mb-6">Join the errand marketplace</p>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 mb-3 border rounded-xl outline-none">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 mb-6 border rounded-xl outline-none">
            
            <div class="flex gap-2 mb-6">
                <button onclick="handleAuth('poster')" class="w-1/2 bg-green-600 text-white py-3 rounded-xl font-bold">Join as Poster</button>
                <button onclick="handleAuth('runner')" class="w-1/2 bg-black text-white py-3 rounded-xl font-bold">Join as Runner</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50">
            <span id="display-role" class="font-bold text-xs uppercase tracking-widest text-green-600"></span>
            <button onclick="logout()" class="text-red-500 text-sm font-bold">Logout</button>
        </nav>

        <div id="view-poster" class="hidden p-4 max-w-lg mx-auto">
            <h2 class="text-2xl font-bold mb-4">My Errands</h2>
            <div class="bg-white p-4 rounded-xl mb-6 shadow-sm border">
                <input type="text" id="tTitle" placeholder="Task Title" class="w-full p-3 mb-2 border rounded-lg">
                <input type="text" id="tLoc" placeholder="Location" class="w-full p-3 mb-2 border rounded-lg">
                <button onclick="createNewErrand()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">Post New Task</button>
            </div>
            <div id="my-errands-list" class="space-y-4"></div>
        </div>

        <div id="view-runner" class="hidden p-4 max-w-lg mx-auto">
            <h2 class="text-2xl font-bold mb-4">Available Work</h2>
            <div id="all-errands-list" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDn3dGe2dhgfrqwYENgWA1biEW8ngXv068",
            authDomain: "office-manager-pro-1b6ae.firebaseapp.com",
            projectId: "office-manager-pro-1b6ae",
            storageBucket: "office-manager-pro-1b6ae.firebasestorage.app",
            messagingSenderId: "202156442292",
            appId: "1:202156442292:web:664d17e9c8e75535168de1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;
        let userRole = null;

        // --- AUTH LOGIC ---
        async function handleAuth(role) {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, pass);
                await db.collection('users').doc(cred.user.uid).set({
                    email: email,
                    role: role,
                    uid: cred.user.uid
                });
                alert("Account Created!");
            } catch (err) {
                // If account exists, just log in
                await auth.signInWithEmailAndPassword(email, pass);
            }
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await db.collection('users').doc(user.uid).get();
                userRole = userDoc.data().role;
                setupDashboard();
            } else {
                showAuth();
            }
        });

        function setupDashboard() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('display-role').innerText = `Role: ${userRole}`;
            
            if(userRole === 'poster') {
                document.getElementById('view-poster').classList.remove('hidden');
                loadPosterErrands();
            } else {
                document.getElementById('view-runner').classList.remove('hidden');
                loadAllErrands();
            }
        }

        // --- POSTER LOGIC ---
        async function createNewErrand() {
            const title = document.getElementById('tTitle').value;
            const loc = document.getElementById('tLoc').value;
            await db.collection('errands').add({
                title, location: loc, posterId: currentUser.uid, status: 'OPEN', createdAt: new Date()
            });
            document.getElementById('tTitle').value = '';
        }

        function loadPosterErrands() {
            db.collection('errands').where('posterId', '==', currentUser.uid).onSnapshot(snap => {
                const list = document.getElementById('my-errands-list');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border">
                            <h3 class="font-bold">${data.title} (${data.status})</h3>
                            <div id="bids-${doc.id}" class="mt-3 pt-3 border-t text-sm text-gray-500 italic">No bids yet...</div>
                        </div>`;
                    loadBidsForErrand(doc.id);
                });
            });
        }

        function loadBidsForErrand(errandId) {
            db.collection('bids').where('errandId', '==', errandId).onSnapshot(snap => {
                const bidDiv = document.getElementById(`bids-${errandId}`);
                if(snap.empty) return;
                bidDiv.innerHTML = "<strong>Bids:</strong><br>";
                snap.forEach(doc => {
                    const bid = doc.data();
                    bidDiv.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2 mt-1 rounded">
                            <span>KES ${bid.amount}</span>
                            <button onclick="acceptBid('${errandId}', '${doc.id}', ${bid.amount})" class="bg-green-600 text-white px-2 py-1 rounded text-xs font-bold">Accept</button>
                        </div>`;
                });
            });
        }

        // --- RUNNER LOGIC ---
        function loadAllErrands() {
            db.collection('errands').where('status', '==', 'OPEN').onSnapshot(snap => {
                const list = document.getElementById('all-errands-list');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border">
                            <h3 class="font-bold">${data.title}</h3>
                            <p class="text-sm text-gray-500">${data.location}</p>
                            <div class="mt-3 flex gap-2">
                                <input type="number" id="amt-${doc.id}" placeholder="Your Bid" class="border p-2 rounded w-full text-sm">
                                <button onclick="placeBid('${doc.id}')" class="bg-black text-white px-4 py-2 rounded text-sm font-bold">Bid</button>
                            </div>
                        </div>`;
                });
            });
        }

        async function placeBid(errandId) {
            const amt = document.getElementById(`amt-${errandId}`).value;
            await db.collection('bids').add({
                errandId, amount: Number(amt), runnerId: currentUser.uid, status: 'PENDING'
            });
            alert("Bid Placed!");
        }

        async function acceptBid(errandId, bidId, amount) {
            // Update the Errand with the final price and chosen runner
            await db.collection('errands').doc(errandId).update({
                status: 'PAYMENT_PENDING',
                finalPrice: amount,
                acceptedBidId: bidId
            });
            alert(`Bid Accepted! Price: KES ${amount}. Time for M-Pesa.`);
        }

        function logout() { auth.signOut(); location.reload(); }
        function showAuth() { document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('dashboard').classList.add('hidden'); }
    </script>
</body>
</html>
