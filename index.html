<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errand - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div id="auth-card" class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
        <div class="mb-6">
            <div class="w-16 h-16 bg-lime-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="package" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Errand</h1>
            <p class="text-gray-500 mt-2">Get things done, or earn running errands.</p>
        </div>

        <div id="login-section">
            <button id="google-login-btn" class="flex items-center justify-center w-full border-2 border-gray-200 py-3 rounded-xl hover:bg-gray-50 transition-all font-semibold gap-3">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/0/google.svg" width="20">
                Sign in with Google
            </button>
        </div>

        <div id="role-section" class="hidden">
            <h2 class="text-xl font-semibold mb-4">Choose your role</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectRole('client')" class="p-4 border-2 border-gray-100 rounded-xl hover:border-lime-500 hover:bg-lime-50 transition-all group">
                    <i data-lucide="user" class="mx-auto mb-2 text-gray-400 group-hover:text-lime-600"></i>
                    <span class="block font-bold">Client</span>
                    <span class="text-xs text-gray-500">I need errands done</span>
                </button>
                <button onclick="selectRole('runner')" class="p-4 border-2 border-gray-100 rounded-xl hover:border-lime-500 hover:bg-lime-50 transition-all group">
                    <i data-lucide="bike" class="mx-auto mb-2 text-gray-400 group-hover:text-lime-600"></i>
                    <span class="block font-bold">Runner</span>
                    <span class="text-xs text-gray-500">I want to run errands</span>
                </button>
            </div>
        </div>

        <div id="loading-section" class="hidden">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-lime-500 mx-auto"></div>
            <p class="mt-4 text-gray-600 italic">Setting up your dashboard...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDn3dGe2dhgfrqwYENgWA1biEW8ngXv068",
            authDomain: "office-manager-pro-1b6ae.firebaseapp.com",
            projectId: "office-manager-pro-1b6ae",
            storageBucket: "office-manager-pro-1b6ae.firebasestorage.app",
            messagingSenderId: "202156442292",
            appId: "1:202156442292:web:664d17e9c8e75535168de1",
            measurementId: "G-BTY9GY3HBX"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('google-login-btn');
        const loginSection = document.getElementById('login-section');
        const roleSection = document.getElementById('role-section');
        const loadingSection = document.getElementById('loading-section');

        // 1. Google Login
        loginBtn.addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                checkUserRole(result.user);
            } catch (error) {
                console.error("Auth Error:", error);
                alert("Login failed. Check console.");
            }
        });

        // 2. Check if user already has a role in Firestore
        async function checkUserRole(user) {
            loginSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            const userDoc = await getDoc(doc(db, "users", user.uid));
            
            if (userDoc.exists()) {
                // User exists, redirect to their dashboard
                redirectToDashboard(userDoc.data().role);
            } else {
                // New User: Show Role Selection
                loadingSection.classList.add('hidden');
                roleSection.classList.remove('hidden');
            }
        }

        // 3. Save Role to Firestore
        window.selectRole = async (role) => {
            const user = auth.currentUser;
            if (!user) return;

            roleSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            await setDoc(doc(db, "users", user.uid), {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName,
                photoURL: user.photoURL,
                role: role,
                createdAt: new Date()
            });

            redirectToDashboard(role);
        };

      function redirectToDashboard(role) {
    console.log(`Redirecting to ${role} dashboard...`);
    
    // This logic sends the user to the specific page based on their role
    if (role === 'client') {
        window.location.href = 'client.html';
    } else if (role === 'runner') {
        window.location.href = 'runner.html';
    }
}

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
