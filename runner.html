<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errand | Runner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-lime-500 rounded flex items-center justify-center">
                <i data-lucide="bike" class="text-white w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold text-gray-800 tracking-tight">Errand</span>
            <span class="ml-2 px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded uppercase tracking-widest">Runner</span>
        </div>
        <div id="user-profile" class="flex items-center gap-3">
            <img id="user-avatar" src="" class="w-10 h-10 rounded-full border border-lime-200">
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Available Errands</h1>
            <p class="text-gray-500">Browse requests and place your bids.</p>
        </div>

        <div id="available-errands" class="space-y-6">
            <div class="text-center py-10"><p class="text-gray-400 animate-pulse">Scanning for errands...</p></div>
        </div>
    </main>

    <div id="bid-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold mb-2" id="modal-title">Place your bid</h2>
            <p class="text-sm text-gray-500 mb-6" id="modal-budget"></p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold mb-2">How much will you charge the client?</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-gray-400 font-bold">$</span>
                        <input type="number" id="bid-amount" oninput="calculateFees(this.value)" placeholder="0.00" class="w-full border-2 border-gray-100 rounded-xl p-3 pl-8 focus:border-lime-500 outline-none text-lg font-bold">
                    </div>
                </div>

                <div class="bg-gray-50 rounded-xl p-4 space-y-2 border border-gray-100">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Platform Fee (20%)</span>
                        <span class="text-red-500 font-medium" id="fee-display">-$0.00</span>
                    </div>
                    <div class="flex justify-between border-t pt-2 font-bold text-gray-800">
                        <span>Your Take-home</span>
                        <span class="text-lime-600" id="takehome-display">$0.00</span>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button onclick="closeBidModal()" class="flex-1 px-4 py-3 rounded-xl font-semibold bg-gray-100 hover:bg-gray-200 transition-all">Cancel</button>
                    <button id="submit-bid-btn" class="flex-[2] bg-lime-500 text-white font-bold py-3 rounded-xl hover:bg-lime-600 shadow-lg shadow-lime-200">Submit Bid</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDn3dGe2dhgfrqwYENgWA1biEW8ngXv068",
            authDomain: "office-manager-pro-1b6ae.firebaseapp.com",
            projectId: "office-manager-pro-1b6ae",
            storageBucket: "office-manager-pro-1b6ae.firebasestorage.app",
            messagingSenderId: "202156442292",
            appId: "1:202156442292:web:664d17e9c8e75535168de1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let activeErrandId = null;

        // UI Helpers
        window.calculateFees = (val) => {
            const amount = parseFloat(val) || 0;
            const fee = amount * 0.20;
            const takehome = amount - fee;
            document.getElementById('fee-display').innerText = `-$${fee.toFixed(2)}`;
            document.getElementById('takehome-display').innerText = `$${takehome.toFixed(2)}`;
        }

        window.openBidModal = (id, title, min, max) => {
            activeErrandId = id;
            document.getElementById('modal-title').innerText = `Bid for: ${title}`;
            document.getElementById('modal-budget').innerText = `Client Budget: $${min} - $${max}`;
            document.getElementById('bid-modal').classList.remove('hidden');
            document.getElementById('bid-modal').classList.add('flex');
        }

        window.closeBidModal = () => {
            document.getElementById('bid-modal').classList.add('hidden');
            document.getElementById('bid-modal').classList.remove('flex');
        }

        // Auth Protection
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'runner') {
                    document.getElementById('user-avatar').src = user.photoURL;
                    loadAvailableErrands();
                } else {
                    window.location.href = "index.html";
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // Load Feed
        function loadAvailableErrands() {
            const q = query(collection(db, "errands"), where("status", "==", "OPEN"));
            
            onSnapshot(q, (snapshot) => {
                const feed = document.getElementById('available-errands');
                feed.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const errand = doc.data();
                    feed.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="bg-lime-100 text-lime-700 text-[10px] font-black px-2 py-0.5 rounded tracking-tighter uppercase">Available</span>
                                    <h3 class="text-lg font-bold text-gray-800">${errand.title}</h3>
                                </div>
                                <p class="text-gray-500 text-sm mb-4 line-clamp-2">${errand.description}</p>
                                <div class="flex gap-4">
                                    <span class="text-xs font-semibold text-gray-400 flex items-center gap-1">
                                        <i data-lucide="tag" class="w-3 h-3"></i> Budget: $${errand.budgetMin}-$${errand.budgetMax}
                                    </span>
                                    <span class="text-xs font-semibold text-gray-400 flex items-center gap-1">
                                        <i data-lucide="user" class="w-3 h-3"></i> Client: ${errand.clientName}
                                    </span>
                                </div>
                            </div>
                            <div class="flex items-center">
                                <button onclick="openBidModal('${doc.id}', '${errand.title}', ${errand.budgetMin}, ${errand.budgetMax})" 
                                    class="w-full md:w-auto bg-gray-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-lime-600 transition-all">
                                    Place Bid
                                </button>
                            </div>
                        </div>
                    `;
                });
                lucide.createIcons();
            });
        }

        // Submit Bid Logic
        document.getElementById('submit-bid-btn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('bid-amount').value);
            if (!amount || amount <= 0) return alert("Please enter a valid bid.");

            const user = auth.currentUser;
            const bidData = {
                errandId: activeErrandId,
                runnerId: user.uid,
                runnerName: user.displayName,
                runnerPhoto: user.photoURL,
                bidAmount: amount,
                platformFee: amount * 0.20,
                runnerTakehome: amount * 0.80,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "bids"), bidData);
                alert("Bid submitted successfully!");
                closeBidModal();
                document.getElementById('bid-amount').value = '';
            } catch (err) {
                console.error(err);
                alert("Error submitting bid.");
            }
        });

    </script>
</body>
</html>
