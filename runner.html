<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errand | Runner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-lime-500 rounded flex items-center justify-center">
                <i data-lucide="bike" class="text-white w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold text-gray-800 tracking-tight">Errand</span>
            <span class="ml-2 px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded uppercase tracking-widest">Runner</span>
        </div>
        <div id="user-profile" class="flex items-center gap-3">
            <img id="user-avatar" src="" class="w-10 h-10 rounded-full border border-lime-200">
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <section class="mb-12">
            <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i data-lucide="clock" class="text-lime-600"></i> My Active Tasks
            </h2>
            <div id="active-tasks" class="space-y-4">
                <p class="text-gray-400 italic text-sm">No active tasks yet.</p>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
                <i data-lucide="search" class="text-lime-600"></i> Browse Errands
            </h2>
            <div id="available-errands" class="space-y-4">
                <div class="text-center py-10"><p class="text-gray-400 animate-pulse">Scanning...</p></div>
            </div>
        </section>
    </main>

    <div id="bid-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold mb-2" id="modal-title">Place your bid</h2>
            <p class="text-sm text-gray-500 mb-6" id="modal-budget"></p>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-700">How much will you charge?</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3 text-gray-400 font-bold">$</span>
                        <input type="number" id="bid-amount" oninput="calculateFees(this.value)" placeholder="0.00" class="w-full border-2 border-gray-100 rounded-xl p-3 pl-8 focus:border-lime-500 outline-none text-lg font-bold">
                    </div>
                </div>

                <div class="bg-lime-50 rounded-xl p-4 space-y-2 border border-lime-100">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-600">Platform Fee (20%)</span>
                        <span class="text-red-500 font-medium" id="fee-display">-$0.00</span>
                    </div>
                    <div class="flex justify-between border-t border-lime-200 pt-2 font-bold text-gray-800">
                        <span>Your Take-home</span>
                        <span class="text-lime-700" id="takehome-display">$0.00</span>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button onclick="closeBidModal()" class="flex-1 px-4 py-3 rounded-xl font-semibold bg-gray-100">Cancel</button>
                    <button id="submit-bid-btn" class="flex-[2] bg-lime-500 text-white font-bold py-3 rounded-xl hover:bg-lime-600">Submit Bid</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDn3dGe2dhgfrqwYENgWA1biEW8ngXv068",
            authDomain: "office-manager-pro-1b6ae.firebaseapp.com",
            projectId: "office-manager-pro-1b6ae",
            storageBucket: "office-manager-pro-1b6ae.firebasestorage.app",
            messagingSenderId: "202156442292",
            appId: "1:202156442292:web:664d17e9c8e75535168de1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let activeErrandId = null;

        // UI Logic
        window.calculateFees = (val) => {
            const amount = parseFloat(val) || 0;
            document.getElementById('fee-display').innerText = `-$${(amount * 0.2).toFixed(2)}`;
            document.getElementById('takehome-display').innerText = `$${(amount * 0.8).toFixed(2)}`;
        }

        window.openBidModal = (id, title, min, max) => {
            activeErrandId = id;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-budget').innerText = `Budget: $${min} - $${max}`;
            document.getElementById('bid-modal').classList.replace('hidden', 'flex');
        }

        window.closeBidModal = () => document.getElementById('bid-modal').classList.replace('flex', 'hidden');

        // Main Logic
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'runner') {
                    document.getElementById('user-avatar').src = user.photoURL;
                    loadFeed();
                    loadActiveTasks(user.uid);
                } else {
                    window.location.href = "index.html";
                }
            } else { window.location.href = "index.html"; }
        });

        function loadFeed() {
            const q = query(collection(db, "errands"), where("status", "==", "OPEN"));
            onSnapshot(q, (snap) => {
                const feed = document.getElementById('available-errands');
                feed.innerHTML = '';
                snap.forEach(d => {
                    const e = d.data();
                    feed.innerHTML += `
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-gray-800">${e.title}</h3>
                                <p class="text-sm text-gray-500">$${e.budgetMin} - $${e.budgetMax}</p>
                            </div>
                            <button onclick="openBidModal('${d.id}', '${e.title}', ${e.budgetMin}, ${e.budgetMax})" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-bold">Bid Now</button>
                        </div>
                    `;
                });
                lucide.createIcons();
            });
        }

        function loadActiveTasks(runnerId) {
            const q = query(collection(db, "errands"), where("status", "==", "IN_PROGRESS"));
            onSnapshot(q, (snap) => {
                const container = document.getElementById('active-tasks');
                container.innerHTML = '';
                let hasTasks = false;

                snap.forEach(async (d) => {
                    const e = d.data();
                    // Only show if the accepted bid belongs to this runner
                    const bidDoc = await getDoc(doc(db, "bids", e.acceptedBidId));
                    if (bidDoc.exists() && bidDoc.data().runnerId === runnerId) {
                        hasTasks = true;
                        container.innerHTML += `
                            <div class="bg-white p-6 rounded-xl border-2 border-lime-500 shadow-md">
                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 class="font-bold text-lg">${e.title}</h3>
                                        <p class="text-sm text-gray-500">Client: ${e.clientName}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs text-gray-400">Escrow Locked</p>
                                        <p class="text-lime-600 font-bold">$${e.finalPrice}</p>
                                    </div>
                                </div>
                                <button onclick="completeErrand('${d.id}')" class="w-full bg-lime-500 text-white font-bold py-3 rounded-lg hover:bg-lime-600 transition-all">
                                    Mark as Completed
                                </button>
                            </div>
                        `;
                    }
                    if (!hasTasks) container.innerHTML = '<p class="text-gray-400 italic text-sm">No active tasks.</p>';
                    lucide.createIcons();
                });
            });
        }

        window.completeErrand = async (id) => {
            if (!confirm("Confirm completion to release funds?")) return;
            await updateDoc(doc(db, "errands", id), { status: 'COMPLETED', completedAt: serverTimestamp() });
            alert("Great job! Errand completed.");
        }

        document.getElementById('submit-bid-btn').addEventListener('click', async () => {
            const amount = parseFloat(document.getElementById('bid-amount').value);
            if (!amount) return;
            await addDoc(collection(db, "bids"), {
                errandId: activeErrandId,
                runnerId: auth.currentUser.uid,
                runnerName: auth.currentUser.displayName,
                runnerPhoto: auth.currentUser.photoURL,
                bidAmount: amount,
                createdAt: serverTimestamp()
            });
            closeBidModal();
        });
    </script>
</body>
</html>
